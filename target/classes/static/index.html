<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Front simples - V2</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <h1>Plataforma V2</h1>
        <p class="subtitulo">admin / 123456 (HTTP Basic)</p>

        <nav>
            <button class="nav-item ativo" data-secao="usuarios" onclick="selecionarSecao('usuarios')">Usuários</button>
            <button class="nav-item" data-secao="cursos" onclick="selecionarSecao('cursos')">Cursos</button>
            <button class="nav-item" data-secao="matriculas" onclick="selecionarSecao('matriculas')">Matrículas</button>
            <button class="nav-item" data-secao="mensalidade" onclick="selecionarSecao('mensalidade')">Mensalidade</button>
        </nav>

        <div class="sidebar-rodape">
            <a href="/swagger-ui/index.html" target="_blank">Abrir Swagger</a>
            <a href="/home" target="_blank">Abrir /home</a>
        </div>
    </aside>

    <main class="conteudo">
        <div id="mensagem"></div>

        <section class="painel-acao" data-secao-painel="usuarios">
            <h2>Criar usuário</h2>
            <label for="nome">Nome</label>
            <input id="nome" placeholder="Nome">
            <label for="email">E-mail</label>
            <input id="email" placeholder="E-mail">
            <label for="senha">Senha</label>
            <input id="senha" type="password" placeholder="Senha">
            <div class="botoes">
                <button onclick="criarUsuario()">Salvar usuário</button>
            </div>
        </section>

        <section class="painel-acao" data-secao-painel="cursos" hidden>
            <h2>Criar curso</h2>
            <label for="tituloCurso">Título</label>
            <input id="tituloCurso" placeholder="Título do curso">
            <label for="descricaoCurso">Descrição</label>
            <textarea id="descricaoCurso" placeholder="Descrição"></textarea>
            <div class="botoes">
                <button onclick="criarCurso()">Salvar curso</button>
            </div>
        </section>

        <section class="painel-acao" data-secao-painel="matriculas" hidden>
            <h2>Matrículas</h2>
            <div class="subforms">
                <div>
                    <h3>Matricular usuário</h3>
                    <label for="matUsuarioId">ID do usuário</label>
                    <input id="matUsuarioId" placeholder="ID do usuário">
                    <label for="matCursoId">ID do curso</label>
                    <input id="matCursoId" placeholder="ID do curso">
                    <label for="matBonus">Tipo de curso</label>
                    <select id="matBonus">
                        <option value="false">Curso normal</option>
                        <option value="true">Curso bônus</option>
                    </select>
                    <div class="botoes">
                        <button onclick="matricular()">Matricular</button>
                    </div>
                </div>
                <div>
                    <h3>Concluir matrícula</h3>
                    <label for="matriculaId">ID da matrícula</label>
                    <input id="matriculaId" placeholder="ID da matrícula">
                    <label for="notaFinal">Nota final</label>
                    <input id="notaFinal" placeholder="Nota final">
                    <div class="botoes">
                        <button onclick="concluirMatricula()">Concluir</button>
                    </div>
                </div>
            </div>
            <label for="consultaUsuarioId" style="margin-top:6px;">Ver matrículas do usuário (ID)</label>
            <input id="consultaUsuarioId" placeholder="ID do usuário">
            <div class="botoes">
                <button class="secundario" onclick="listarMatriculasUsuario()">Listar na tabela</button>
            </div>
        </section>

        <section class="painel-acao" data-secao-painel="mensalidade" hidden>
            <h2>Mensalidade do usuário</h2>
            <label for="mensalidadeUsuarioId">ID do usuário</label>
            <input id="mensalidadeUsuarioId" placeholder="ID do usuário">
            <label for="mensalidadeStatus">Status</label>
            <select id="mensalidadeStatus">
                <option value="PAGA">PAGA</option>
                <option value="PENDENTE">PENDENTE</option>
            </select>
            <div class="botoes">
                <button onclick="atualizarMensalidade()">Atualizar mensalidade</button>
            </div>
        </section>

        <section class="painel-tabela">
            <div class="tabela-topo">
                <h2 id="tabela-titulo">Usuários</h2>
                <button class="secundario" onclick="atualizarSecaoAtual()">Atualizar lista</button>
            </div>
            <table>
                <thead><tr id="tabela-thead-row"></tr></thead>
                <tbody id="tabela-tbody"></tbody>
            </table>
        </section>
    </main>
</div>
<script src="/js/app.js"></script>
</body>
</html>
