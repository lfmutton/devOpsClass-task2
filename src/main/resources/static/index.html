<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Front simples - V2</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <header class="topo">
        <h1>Plataforma de cursos - versão 2</h1>
        <p>Login HTTP Basic usado no front: <strong>admin / 123456</strong></p>
        <div class="links">
            <a href="/swagger-ui/index.html" target="_blank">Abrir Swagger</a>
            <a href="/home" target="_blank">Abrir /home</a>
        </div>
    </header>

    <div id="mensagem"></div>

    <div class="grid">
        <div class="card">
            <h2>Criar usuário</h2>
            <label for="nome">Nome</label>
            <input id="nome" placeholder="Nome">
            <label for="email">E-mail</label>
            <input id="email" placeholder="E-mail">
            <label for="senha">Senha</label>
            <input id="senha" type="password" placeholder="Senha">
            <div class="botoes">
                <button onclick="criarUsuario()">Salvar usuário</button>
                <button class="secundario" onclick="listarUsuarios()">Listar usuários</button>
            </div>
            <ul id="usuarios"></ul>
        </div>

        <div class="card">
            <h2>Criar curso</h2>
            <label for="tituloCurso">Título</label>
            <input id="tituloCurso" placeholder="Título do curso">
            <label for="descricaoCurso">Descrição</label>
            <textarea id="descricaoCurso" placeholder="Descrição"></textarea>
            <div class="botoes">
                <button onclick="criarCurso()">Salvar curso</button>
                <button class="secundario" onclick="listarCursos()">Listar cursos</button>
            </div>
            <ul id="cursos"></ul>
        </div>
    </div>

    <div class="grid secao">
        <div class="card">
            <h2>Matricular usuário</h2>
            <label for="matUsuarioId">ID do usuário</label>
            <input id="matUsuarioId" placeholder="ID do usuário">
            <label for="matCursoId">ID do curso</label>
            <input id="matCursoId" placeholder="ID do curso">
            <label for="matBonus">Tipo de curso</label>
            <select id="matBonus">
                <option value="false">Curso normal</option>
                <option value="true">Curso bônus</option>
            </select>
            <div class="botoes">
                <button onclick="matricular()">Matricular</button>
            </div>
        </div>

        <div class="card">
            <h2>Concluir matrícula</h2>
            <label for="matriculaId">ID da matrícula</label>
            <input id="matriculaId" placeholder="ID da matrícula">
            <label for="notaFinal">Nota final</label>
            <input id="notaFinal" placeholder="Nota final">
            <div class="botoes">
                <button onclick="concluirMatricula()">Concluir</button>
            </div>
        </div>
    </div>

    <div class="grid secao">
        <div class="card">
            <h2>Mensalidade do usuário</h2>
            <label for="mensalidadeUsuarioId">ID do usuário</label>
            <input id="mensalidadeUsuarioId" placeholder="ID do usuário">
            <label for="mensalidadeStatus">Status</label>
            <select id="mensalidadeStatus">
                <option value="PAGA">PAGA</option>
                <option value="PENDENTE">PENDENTE</option>
            </select>
            <div class="botoes">
                <button onclick="atualizarMensalidade()">Atualizar mensalidade</button>
            </div>
            <ul id="mensalidadeResultado"></ul>
        </div>

        <div class="card">
            <h2>Consultar matrículas por usuário</h2>
            <label for="consultaUsuarioId">ID do usuário</label>
            <input id="consultaUsuarioId" placeholder="ID do usuário">
            <div class="botoes">
                <button onclick="listarMatriculasUsuario()">Listar matrículas</button>
            </div>
            <ul id="matriculas"></ul>
        </div>
    </div>
</div>
<script src="/js/app.js"></script>
</body>
</html>
