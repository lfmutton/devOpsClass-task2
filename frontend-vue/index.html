<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Vue - V2</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; padding: 24px; }
        .box { max-width: 900px; margin: auto; background: white; padding: 24px; border-radius: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        input, textarea, button, select { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; }
    </style>
</head>
<body>
<div id="app" class="box">
    <h1>Vue.js consumindo a API v2</h1>
    <div class="grid">
        <div>
            <h2>Usuários</h2>
            <input v-model="usuario.nome" placeholder="Nome">
            <input v-model="usuario.email" placeholder="E-mail">
            <input v-model="usuario.senha" type="password" placeholder="Senha">
            <button @click="criarUsuario">Criar usuário</button>
            <button @click="listarUsuarios">Atualizar usuários</button>
            <ul>
                <li v-for="u in usuarios" :key="u.id">{{ u.id }} - {{ u.nome }} | {{ u.plano }} | créditos {{ u.creditosCursos }}</li>
            </ul>
        </div>
        <div>
            <h2>Cursos</h2>
            <input v-model="curso.titulo" placeholder="Título">
            <textarea v-model="curso.descricao" placeholder="Descrição"></textarea>
            <button @click="criarCurso">Criar curso</button>
            <button @click="listarCursos">Atualizar cursos</button>
            <ul>
                <li v-for="c in cursos" :key="c.id">{{ c.id }} - {{ c.titulo }}</li>
            </ul>
        </div>
    </div>
    <p>{{ mensagem }}</p>
</div>
<script>
const { createApp } = Vue;
createApp({
    data() {
        return {
            apiBase: 'http://localhost:8080',
            auth: 'Basic ' + btoa('admin:123456'),
            mensagem: '',
            usuarios: [],
            cursos: [],
            usuario: { nome: '', email: '', senha: '' },
            curso: { titulo: '', descricao: '' }
        }
    },
    methods: {
        async request(path, options = {}) {
            const response = await fetch(this.apiBase + path, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': this.auth,
                    ...(options.headers || {})
                }
            });
            const text = await response.text();
            if (!response.ok) throw new Error(text || 'Erro');
            return text ? JSON.parse(text) : null;
        },
        async listarUsuarios() {
            this.usuarios = await this.request('/api/usuarios');
        },
        async criarUsuario() {
            await this.request('/api/usuarios', { method: 'POST', body: JSON.stringify(this.usuario) });
            this.usuario = { nome: '', email: '', senha: '' };
            this.mensagem = 'Usuário criado';
            await this.listarUsuarios();
        },
        async listarCursos() {
            this.cursos = await this.request('/api/cursos');
        },
        async criarCurso() {
            await this.request('/api/cursos', { method: 'POST', body: JSON.stringify(this.curso) });
            this.curso = { titulo: '', descricao: '' };
            this.mensagem = 'Curso criado';
            await this.listarCursos();
        }
    },
    mounted() {
        this.listarUsuarios();
        this.listarCursos();
    }
}).mount('#app');
</script>
</body>
</html>
